[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-brain"
version = "0.1.0"
description = "Nexus Brain - a human-brain-inspired, human-supervised cognitive architecture for AI assistants."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nexus Brain contributors" }]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
llm = ["httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
nexus-brain = "nexus_brain.cli:main"

[tool.setuptools.packages.find]
include = ["nexus_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
